name: PhD Radar

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (03:17 in São Paulo)
  workflow_dispatch:
    inputs:
      debug:
        description: "Save raw downloaded pages as a run artifact"
        type: boolean
        default: false
      only:
        description: "Run only these sources (space-separated, e.g. 'adum cnrs'); empty = all"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          RADAR_DEBUG_DIR: ${{ inputs.debug && 'debug' || '' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.run ${{ inputs.only }}
      - name: Upload debug pages
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: |
            debug/
            data/status.json
      - name: Commit data
        run: |
          git config user.name "phd-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update offers $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
