name: PhD Radar

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (03:17 in São Paulo)
  workflow_dispatch:
    inputs:
      debug:
        description: "Save raw downloaded pages as a run artifact"
        type: boolean
        default: false
      only:
        description: "Run only these sources (space-separated, e.g. 'adum cnrs'); empty = all"
        type: string
        default: ""
      probe:
        description: "Debug: space-separated URLs to download into the 'debug' branch (skips scraping)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe URLs
        if: ${{ inputs.probe != '' }}
        env:
          PROBE_URLS: ${{ inputs.probe }}
        run: |
          python -m radar.probe $PROBE_URLS
          git config user.name "phd-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan debug
          git rm -rqf --cached .
          git add -f debug
          git commit -qm "probe"
          git push -f origin debug
      - name: Run radar
        if: ${{ inputs.probe == '' }}
        env:
          RADAR_DEBUG_DIR: ${{ inputs.debug && 'debug' || '' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.run ${{ inputs.only }}
      - name: Save debug pages to the 'debug' branch
        if: ${{ inputs.debug && inputs.probe == '' }}
        run: |
          mkdir -p /tmp/dbg && cp -r debug data/status.json /tmp/dbg/ 2>/dev/null || true
          git config user.name "phd-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git worktree add --orphan -b debug-tmp /tmp/wt
          cp -r /tmp/dbg/* /tmp/wt/ && cd /tmp/wt && git add -A && git commit -qm "debug run" && git push -f origin debug-tmp:debug
      - name: Commit data
        if: ${{ inputs.probe == '' }}
        run: |
          git config user.name "phd-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update offers $(date -u +%F)"
          # if main moved during the run (e.g. a config edit), replay our data commit on top of it
          for i in 1 2 3; do git push && break || (git pull --rebase -X theirs origin main && sleep 2); done
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.probe == '' }}
        with:
          path: docs

  deploy:
    needs: scrape
    if: ${{ inputs.probe == '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
